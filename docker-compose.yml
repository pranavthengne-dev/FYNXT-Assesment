services:
  postgres:
    image: postgres:16-alpine
    container_name: fynxt-orderbook-postgres
    environment:
      POSTGRES_DB: orderbook
      POSTGRES_USER: orderbook_user
      POSTGRES_PASSWORD: orderbook_password
    ports:
      - "5432:5432"
    volumes:
      - orderbook_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderbook_user -d orderbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fynxt-orderbook-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  orderbook_postgres_data:
  pgadmin_data:
