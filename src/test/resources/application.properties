spring.datasource.url=jdbc:h2:mem:orderbook-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
server.port=0
spring.h2.console.enabled=false
logging.file.name=target/test-logs/orderbook-test.log
logging.level.root=INFO
logging.level.com.fynxt.orderbook=DEBUG
logging.logback.rollingpolicy.file-name-pattern=target/test-logs/orderbook-test-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=100MB
orderbook.max-pending-orders=3
orderbook.risk.high-overlap-percent=60.0
orderbook.risk.medium-overlap-percent=40.0
orderbook.baskets.TECH_HEAVY=AAPL,MSFT,GOOGL,TSLA,NVDA
orderbook.baskets.FINANCE_HEAVY=JPM,GS,BAC,MS,WFC
orderbook.baskets.BALANCED=AAPL,JPM,XOM,JNJ,TSLA
orderbook.stocks-by-sector.TECH=AAPL,MSFT,GOOGL,TSLA,NVDA
orderbook.stocks-by-sector.FINANCE=JPM,GS,BAC,MS,WFC
orderbook.stocks-by-sector.ENERGY=XOM
orderbook.stocks-by-sector.HEALTHCARE=JNJ
