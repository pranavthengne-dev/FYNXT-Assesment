spring.datasource.url=jdbc:postgresql://localhost:5432/orderbook
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=orderbook_user
spring.datasource.password=orderbook_password
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
server.port=8082
logging.file.name=logs/orderbook.log
logging.level.root=INFO
logging.level.com.fynxt.orderbook=DEBUG
logging.logback.rollingpolicy.file-name-pattern=logs/orderbook-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
orderbook.max-pending-orders=3
orderbook.risk.high-overlap-percent=60.0
orderbook.risk.medium-overlap-percent=40.0
